name: mediscan
description: AI-powered medical report analysis app
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.1
  # UI & Design
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  lottie: ^2.7.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9
  glassmorphism: ^3.0.0
  dotted_border: ^2.1.0

  # File Handling
  image_picker: ^1.0.7
  file_picker: ^10.3.10
  camera: ^0.10.5+9
  permission_handler: ^11.1.0

  # PDF
  syncfusion_flutter_pdf: ^24.1.41
  flutter_pdfview: ^1.3.2

  # OpenAI / Networking
  dart_openai: ^4.1.0
  http: ^1.1.0
  dio: ^5.4.0

  # Storage & State
  shared_preferences: ^2.2.2
  flutter_riverpod: ^2.4.9
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.18.1
  path_provider: ^2.1.2
  uuid: ^4.3.3
  share_plus: ^7.2.1
  image: ^4.1.3
  flutter_dotenv: ^5.1.0
  google_mobile_ads: ^5.1.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21